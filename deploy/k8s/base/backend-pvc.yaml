# Persistent volume for the SQLite transcript store (docs/design §7.5).
# A local SQLite file makes the backend STATEFUL: it needs durable storage and a
# single replica (replicas can't share a local file). This PVC + `replicas: 1` +
# `strategy: Recreate` (in backend-deployment.yaml) is the whole story.
#
# To go stateless/horizontal (N replicas), graduate the store to Turso/libSQL
# (same Drizzle schema) and DELETE this PVC + the volume mount — see design §7.5.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: df-cerebe-data
  labels: { app: df-cerebe-backend }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
