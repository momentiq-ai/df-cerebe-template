# Serves the built Svelte SPA. DEPLOY ONLY.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: every non-file route serves index.html so client-side routing
  # works on refresh / deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # NOTE(arch): the SPA calls the backend at its own origin (VITE_API_BASE_URL,
  # baked at build time). If you'd rather route /api through this nginx instead,
  # add a `location /api { proxy_pass http://df-cerebe-backend:8787; }` block and
  # the matching k8s Service DNS name. Left out to keep frontend and backend
  # independently deployable. docs/notes.md.
}
